# dsh-vesta bundle patch
#
# 往当前 profile 的插件树里插一行，挂载插件提供的 20 个模型可调用工具
# （VESTA 控制 / VASP 后处理 / 结构分析 / 可视化）。
#
# config 会整体覆盖 index.js 的 DEFAULTS（浅合并），只写想改的项即可。
- insert:
    - id: vesta
      name: '@local/dsh-vesta'
      config:
        # VESTA 可执行文件。不填时按常见安装位置自动探测，
        # 也可设环境变量 VESTA_EXE（优先级最高）。
        # executable: '/path/to/VESTA.exe'
        maxFiles: 10
# reload: vesta_view
